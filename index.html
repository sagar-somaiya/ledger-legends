<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEDGER LEGENDS — Accounting Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#050308;
    --cabinet:#1b0f2e;
    --cabinet-2:#2a1442;
    --trim:#ff2d78;
    --trim-2:#ffb703;
    --screen:#050c14;
    --gold:#ffd23f;
    --cyan:#39e6ff;
    --danger:#ff3b5c;
    --success:#3cffa0;
    --ink:#eaf6ff;
    --ink-dim:#7d94a8;
    --f-display:'Press Start 2P', monospace;
    --f-body:'Space Grotesk', sans-serif;
    --f-digit:'VT323', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(ellipse at 50% 0%, #140a24 0%, var(--void) 60%);
    font-family:var(--f-body);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:18px; overflow-x:hidden;
  }

  /* ============ CABINET ============ */
  .cabinet{
    width:100%; max-width:620px;
    background:linear-gradient(160deg,var(--cabinet-2) 0%, var(--cabinet) 55%, #120826 100%);
    border-radius:26px;
    padding:16px 16px 22px;
    box-shadow:
      0 0 0 3px #000,
      0 0 0 6px #3a1f5c,
      0 40px 90px rgba(0,0,0,.7),
      inset 0 2px 0 rgba(255,255,255,.06);
    position:relative;
  }
  .cabinet::before{
    content:"";
    position:absolute; inset:8px 8px auto 8px; height:2px;
    background:linear-gradient(90deg,transparent, rgba(255,255,255,.25), transparent);
  }

  .marquee{
    text-align:center; padding:14px 10px 18px;
  }
  .marquee h1{
    font-family:var(--f-display);
    font-size:clamp(18px,4.6vw,30px);
    margin:0; letter-spacing:2px;
    color:var(--trim-2);
    text-shadow:
      0 0 6px var(--trim-2),
      0 0 18px var(--trim),
      0 0 34px var(--trim);
    animation:flicker 4.2s infinite;
  }
  .marquee p{
    margin:8px 0 0; font-family:var(--f-display); font-size:9px;
    letter-spacing:4px; color:var(--cyan);
    text-shadow:0 0 10px rgba(57,230,255,.7);
  }
  @keyframes flicker{
    0%,19%,21%,23%,54%,56%,100%{opacity:1;}
    20%,22%,55%{opacity:.72;}
  }

  /* ============ SCREEN ============ */
  .screen{
    position:relative; background:radial-gradient(ellipse at 50% -10%, #0d1c2b 0%, var(--screen) 65%);
    border-radius:14px; padding:16px 16px 14px;
    box-shadow:inset 0 0 0 2px #000, inset 0 0 40px rgba(0,0,0,.8);
    overflow:hidden;
  }
  .screen.shake{ animation:shakeScr .38s; }
  @keyframes shakeScr{
    0%,100%{transform:translate(0,0);}
    20%{transform:translate(-6px,2px);}
    40%{transform:translate(6px,-2px);}
    60%{transform:translate(-4px,2px);}
    80%{transform:translate(4px,-1px);}
  }
  .scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 2px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .vignette{
    position:absolute; inset:0; pointer-events:none; z-index:6;
    box-shadow:inset 0 0 80px rgba(0,0,0,.65);
    border-radius:14px;
  }

  /* ============ HUD ============ */
  .hud{
    position:relative; z-index:2;
    display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between;
    padding-bottom:12px; margin-bottom:12px;
    border-bottom:1px dashed rgba(255,255,255,.12);
  }
  .hud-item{display:flex; flex-direction:column; gap:2px; min-width:70px;}
  .hud-item .label{
    font-family:var(--f-display); font-size:7.5px; letter-spacing:1.5px; color:var(--ink-dim);
  }
  .hud-item .value{ font-family:var(--f-digit); font-size:20px; color:var(--ink); line-height:1; }
  .hud-item.score .digits{
    font-family:var(--f-digit); font-size:26px; letter-spacing:2px; color:var(--gold);
    text-shadow:0 0 10px rgba(255,210,63,.6);
  }
  .hud-item.streak .value{ color:var(--cyan); text-shadow:0 0 8px rgba(57,230,255,.6); display:flex; align-items:center; gap:4px;}
  #streak-flame{ filter:grayscale(1); opacity:.35; transition:.2s; font-size:16px;}
  #streak-flame.lit{ filter:none; opacity:1; }
  .hud-item.level .stars{ color:var(--trim-2); font-size:13px; letter-spacing:1px;}
  .hud-item.accuracy .value{ color:var(--success); }

  /* ============ MISSION CARD ============ */
  .mission-card{
    position:relative; z-index:2;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px; padding:16px 14px; margin-bottom:16px;
    text-align:center;
  }
  .mission-tag{
    font-family:var(--f-display); font-size:8.5px; color:var(--cyan);
    letter-spacing:1.5px; margin-bottom:10px;
  }
  .mission-text{
    font-size:16px; font-weight:600; color:var(--ink); line-height:1.5;
    font-style:italic;
  }
  .mission-amount{
    margin-top:10px; font-family:var(--f-digit); font-size:30px; color:var(--gold);
    text-shadow:0 0 12px rgba(255,210,63,.55);
  }

  /* ============ SELECTION ============ */
  .select-row{ position:relative; z-index:2; margin-bottom:14px; }
  .select-label{
    font-family:var(--f-display); font-size:9px; letter-spacing:1px; color:var(--ink-dim);
    margin-bottom:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .select-label .chosen{
    font-family:var(--f-body); font-size:12.5px; font-weight:700; color:var(--success);
    text-transform:none; letter-spacing:0;
  }
  .chip-grid{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    font-family:var(--f-body); font-size:12px; font-weight:600;
    background:#231238; border:1.5px solid #4a2d6e; color:var(--ink);
    padding:7px 11px; border-radius:20px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:.12s; -webkit-user-select:none; user-select:none;
  }
  .chip:hover{ border-color:var(--cyan); transform:translateY(-1px); }
  .chip.selected{
    background:linear-gradient(135deg,#3a2a10,#241708);
    border-color:var(--gold); color:var(--gold);
    box-shadow:0 0 12px rgba(255,210,63,.4);
    animation:chipPop .28s ease;
  }
  .chip.locked{ opacity:.35; cursor:default; pointer-events:none; }
  @keyframes chipPop{
    0%{transform:scale(.85);} 60%{transform:scale(1.08);} 100%{transform:scale(1);}
  }

  /* ============ ACTIONS ============ */
  .action-row{ position:relative; z-index:2; display:flex; justify-content:center; margin-bottom:8px;}
  .arcade-btn{
    font-family:var(--f-display); font-size:11px; letter-spacing:1px;
    padding:14px 26px; border-radius:10px; border:none; cursor:pointer;
    color:#2a0a10; background:linear-gradient(180deg,#ff5c7d,var(--trim));
    box-shadow:0 6px 0 #9c1440, 0 10px 20px rgba(255,45,120,.35);
    transition:.08s;
  }
  .arcade-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #9c1440; }
  .arcade-btn:disabled{
    background:#2b2b33; color:#666; box-shadow:0 6px 0 #17171c; cursor:not-allowed;
  }
  .arcade-btn.next{
    background:linear-gradient(180deg,#4bffb0,#12b871);
    box-shadow:0 6px 0 #0a6e42, 0 10px 20px rgba(18,184,113,.35);
    color:#022;
  }
  .arcade-btn.next:active{ box-shadow:0 2px 0 #0a6e42; }

  /* ============ FEEDBACK ============ */
  .feedback-banner{
    position:relative; z-index:2; min-height:26px; text-align:center;
    font-family:var(--f-body); font-size:13px; font-weight:600; margin:6px 0 10px;
  }
  .feedback-banner.correct{ color:var(--success); }
  .feedback-banner.wrong{ color:var(--danger); }

  .float-pop{
    position:absolute; left:50%; top:40%; transform:translate(-50%,0);
    font-family:var(--f-display); font-size:20px; z-index:20;
    pointer-events:none; animation:floatUp 1.1s ease-out forwards;
  }
  .float-pop.good{ color:var(--gold); text-shadow:0 0 14px rgba(255,210,63,.8);}
  .float-pop.bad{ color:var(--danger); text-shadow:0 0 14px rgba(255,59,92,.8);}
  @keyframes floatUp{
    0%{opacity:0; transform:translate(-50%,10px) scale(.7);}
    15%{opacity:1; transform:translate(-50%,-8px) scale(1.1);}
    30%{transform:translate(-50%,-14px) scale(1);}
    100%{opacity:0; transform:translate(-50%,-70px) scale(1);}
  }
  .spark{
    position:absolute; z-index:19; pointer-events:none; font-size:16px;
    animation:sparkFly 900ms ease-out forwards;
  }
  @keyframes sparkFly{
    0%{opacity:1; transform:translate(0,0) scale(.6) rotate(0deg);}
    100%{opacity:0; transform:var(--fly) scale(1.1) rotate(180deg);}
  }

  /* ============ LOG STRIP ============ */
  .log-strip{
    position:relative; z-index:2;
    background:rgba(0,0,0,.35); border-radius:8px; padding:8px 10px;
    max-height:74px; overflow-y:auto;
    font-family:var(--f-digit); font-size:14px; line-height:1.35;
  }
  .log-strip .ln{ white-space:pre-wrap; }
  .log-strip .pass{ color:var(--success); }
  .log-strip .fail{ color:var(--danger); }
  .log-strip .info{ color:var(--ink-dim); }
  .log-strip .combo{ color:var(--trim-2); }
  .log-strip .lvl{ color:var(--cyan); }
  .log-strip::-webkit-scrollbar{ width:6px; }
  .log-strip::-webkit-scrollbar-thumb{ background:#3a2a4e; border-radius:4px;}

  /* ============ CABINET BASE ============ */
  .cabinet-base{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 10px 4px; gap:10px; flex-wrap:wrap;
  }
  .joystick{
    width:46px; height:46px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3a3a44, #111 70%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 8px rgba(0,0,0,.5);
  }
  .stick{ width:16px; height:16px; border-radius:50%; background:var(--trim); box-shadow:0 0 10px var(--trim);}
  .buttons{ display:flex; gap:8px; }
  .buttons .btn{
    width:22px; height:22px; border-radius:50%; display:inline-block;
    box-shadow:0 3px 0 rgba(0,0,0,.4), inset 0 -2px 4px rgba(0,0,0,.3);
  }
  .b1{ background:#ff3b5c; }
  .b2{ background:#ffd23f; }
  .b3{ background:#39e6ff; }
  .insert-coin{
    font-family:var(--f-display); font-size:9px; color:var(--gold);
    letter-spacing:1px; text-shadow:0 0 8px rgba(255,210,63,.5);
  }

  /* ============ TOASTS ============ */
  .toast-layer{
    position:fixed; top:22px; right:22px; display:flex; flex-direction:column; gap:10px; z-index:100;
  }
  .toast{
    font-family:var(--f-body); font-weight:700; font-size:13px;
    background:linear-gradient(135deg,#241030,#150a1c);
    border:1.5px solid var(--trim-2); color:var(--trim-2);
    padding:12px 16px; border-radius:10px; max-width:250px;
    box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 20px rgba(255,183,3,.25);
    animation:toastIn .3s ease, toastOut .3s ease 2.7s forwards;
  }
  .toast.level{ border-color:var(--cyan); color:var(--cyan); box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 20px rgba(57,230,255,.3);}
  @keyframes toastIn{ from{ transform:translateX(120%); opacity:0;} to{ transform:translateX(0); opacity:1;} }
  @keyframes toastOut{ to{ transform:translateX(120%); opacity:0;} }

  @media (max-width:480px){
    .mission-text{font-size:14px;}
    .mission-amount{font-size:24px;}
    .hud-item .digits{font-size:20px;}
    .arcade-btn{ padding:12px 18px; font-size:10px;}
  }
</style>
</head>
<body>

<div class="cabinet">
  <div class="marquee">
    <h1>LEDGER LEGENDS</h1>
    <p>ACCOUNTING ARCADE</p>
  </div>

  <div class="screen" id="screen">
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="hud">
      <div class="hud-item score">
        <span class="label">SCORE</span>
        <span class="digits" id="score-digits">0000000</span>
      </div>
      <div class="hud-item level">
        <span class="label">LEVEL</span>
        <span class="value" id="level-value" style="font-size:14px;">1·BASICS</span>
        <span class="stars" id="level-stars">★☆☆</span>
      </div>
      <div class="hud-item streak">
        <span class="label">STREAK</span>
        <span class="value"><span id="streak-flame">🔥</span><span id="streak-value">0</span></span>
      </div>
      <div class="hud-item accuracy">
        <span class="label">ACCURACY</span>
        <span class="value" id="accuracy-value">—</span>
      </div>
    </div>

    <div class="mission-card">
      <div class="mission-tag" id="mission-tag">TRANSACTION #1</div>
      <div class="mission-text" id="mission-text">Loading…</div>
      <div class="mission-amount" id="mission-amount">₹0</div>
    </div>

    <div class="select-row">
      <div class="select-label">① DEBIT ACCOUNT <span class="chosen" id="debit-chosen"></span></div>
      <div class="chip-grid" id="debit-grid"></div>
    </div>
    <div class="select-row">
      <div class="select-label">② CREDIT ACCOUNT <span class="chosen" id="credit-chosen"></span></div>
      <div class="chip-grid" id="credit-grid"></div>
    </div>

    <div class="action-row">
      <button class="arcade-btn submit" id="submit-btn" disabled>SUBMIT ENTRY ▶</button>
      <button class="arcade-btn next" id="next-btn" style="display:none;">NEXT ROUND ▶▶</button>
    </div>

    <div class="feedback-banner" id="feedback-banner"></div>

    <div class="log-strip" id="log-strip">
      <div class="ln info">&gt; INSERT COIN... LEDGER LEGENDS BOOTING</div>
      <div class="ln info">&gt; Level 1 · Basics loaded (10 transactions)</div>
    </div>
  </div>

  <div class="cabinet-base">
    <div class="joystick"><div class="stick"></div></div>
    <div class="insert-coin">HIGH SCORE: <span id="highscore-value">0000000</span></div>
    <div class="buttons"><span class="btn b1"></span><span class="btn b2"></span><span class="btn b3"></span></div>
  </div>
</div>

<div class="toast-layer" id="toast-layer"></div>

<script>
(function(){

// ---------- Account metadata ----------
const ACCOUNTS = {
  "Cash A/c":"A","Bank A/c":"A","Furniture A/c":"A","Debtors A/c":"A","Prepaid Insurance A/c":"A","Accrued Interest A/c":"A",
  "Creditors A/c":"L","Loan A/c":"L","Outstanding Salary A/c":"L","Provision for Doubtful Debts A/c":"L",
  "Sales A/c":"I","Commission Received A/c":"I","Interest Received A/c":"I",
  "Purchases A/c":"E","Salary A/c":"E","Rent A/c":"E","Stationery A/c":"E","Advertising A/c":"E",
  "Insurance A/c":"E","Interest A/c":"E","Electricity A/c":"E","Bad Debts A/c":"E","Depreciation A/c":"E",
  "Bank Charges A/c":"E","Purchase Returns A/c":"E","Sales Returns A/c":"E",
  "Drawings A/c":"C","Capital A/c":"C"
};
const TAG_ICON = {A:"💰",L:"🏦",I:"📈",E:"📉",C:"👤"};
function fmtINR(n){ return "₹" + n.toLocaleString("en-IN"); }

// ---------- Transaction bank ----------
const LEVELS = [
  { name:"Basics", stars:"★☆☆",
    accounts:["Cash A/c","Bank A/c","Furniture A/c","Purchases A/c","Sales A/c","Salary A/c","Creditors A/c","Debtors A/c","Rent A/c","Capital A/c"],
    txns:[
      {d:"Bought furniture ₹50,000 by bank", amt:50000, debit:"Furniture A/c", credit:"Bank A/c"},
      {d:"Purchased goods ₹80,000 on credit", amt:80000, debit:"Purchases A/c", credit:"Creditors A/c"},
      {d:"Sold goods for cash ₹1,20,000", amt:120000, debit:"Cash A/c", credit:"Sales A/c"},
      {d:"Paid salary ₹30,000 in cash", amt:30000, debit:"Salary A/c", credit:"Cash A/c"},
      {d:"Received payment from a customer ₹60,000", amt:60000, debit:"Cash A/c", credit:"Debtors A/c"},
      {d:"Paid supplier ₹40,000 by bank", amt:40000, debit:"Creditors A/c", credit:"Bank A/c"},
      {d:"Started business with capital ₹5,00,000 by bank", amt:500000, debit:"Bank A/c", credit:"Capital A/c"},
      {d:"Paid rent ₹15,000 by cash", amt:15000, debit:"Rent A/c", credit:"Cash A/c"},
      {d:"Deposited cash into bank ₹1,00,000", amt:100000, debit:"Bank A/c", credit:"Cash A/c"},
      {d:"Sold goods on credit ₹90,000", amt:90000, debit:"Debtors A/c", credit:"Sales A/c"}
    ]
  },
  { name:"Intermediate", stars:"★★☆",
    accounts:["Cash A/c","Bank A/c","Drawings A/c","Commission Received A/c","Interest A/c","Stationery A/c","Advertising A/c","Insurance A/c","Bad Debts A/c","Debtors A/c","Loan A/c","Electricity A/c"],
    txns:[
      {d:"Owner withdrew cash ₹10,000 for personal use", amt:10000, debit:"Drawings A/c", credit:"Cash A/c"},
      {d:"Received commission ₹8,000 in cash", amt:8000, debit:"Cash A/c", credit:"Commission Received A/c"},
      {d:"Paid interest on loan ₹5,000 by bank", amt:5000, debit:"Interest A/c", credit:"Bank A/c"},
      {d:"Bought stationery ₹3,000 by cash", amt:3000, debit:"Stationery A/c", credit:"Cash A/c"},
      {d:"Paid for advertising ₹20,000 by bank", amt:20000, debit:"Advertising A/c", credit:"Bank A/c"},
      {d:"Paid insurance premium ₹12,000 by bank", amt:12000, debit:"Insurance A/c", credit:"Bank A/c"},
      {d:"A customer's debt of ₹7,000 is written off as bad", amt:7000, debit:"Bad Debts A/c", credit:"Debtors A/c"},
      {d:"Took a loan from the bank ₹2,00,000", amt:200000, debit:"Bank A/c", credit:"Loan A/c"},
      {d:"Repaid part of the bank loan ₹50,000", amt:50000, debit:"Loan A/c", credit:"Bank A/c"},
      {d:"Paid electricity bill ₹6,000 by cash", amt:6000, debit:"Electricity A/c", credit:"Cash A/c"}
    ]
  },
  { name:"Advanced", stars:"★★★",
    accounts:["Salary A/c","Outstanding Salary A/c","Prepaid Insurance A/c","Bank A/c","Furniture A/c","Depreciation A/c","Bank Charges A/c","Creditors A/c","Purchase Returns A/c","Sales Returns A/c","Debtors A/c","Accrued Interest A/c","Interest Received A/c","Advertising A/c","Purchases A/c","Drawings A/c","Bad Debts A/c","Provision for Doubtful Debts A/c"],
    txns:[
      {d:"Salary of ₹25,000 is outstanding for the month", amt:25000, debit:"Salary A/c", credit:"Outstanding Salary A/c"},
      {d:"Paid insurance in advance for next year ₹18,000 by bank", amt:18000, debit:"Prepaid Insurance A/c", credit:"Bank A/c"},
      {d:"Charged depreciation on furniture ₹5,000", amt:5000, debit:"Depreciation A/c", credit:"Furniture A/c"},
      {d:"Bank charged fees of ₹500", amt:500, debit:"Bank Charges A/c", credit:"Bank A/c"},
      {d:"Returned goods to a supplier worth ₹10,000", amt:10000, debit:"Creditors A/c", credit:"Purchase Returns A/c"},
      {d:"A customer returned goods worth ₹15,000", amt:15000, debit:"Sales Returns A/c", credit:"Debtors A/c"},
      {d:"Interest of ₹4,000 has accrued but not yet received", amt:4000, debit:"Accrued Interest A/c", credit:"Interest Received A/c"},
      {d:"Goods worth ₹6,000 distributed as free samples", amt:6000, debit:"Advertising A/c", credit:"Purchases A/c"},
      {d:"Goods worth ₹9,000 taken by the owner for personal use", amt:9000, debit:"Drawings A/c", credit:"Purchases A/c"},
      {d:"Made a provision for doubtful debts ₹12,000", amt:12000, debit:"Bad Debts A/c", credit:"Provision for Doubtful Debts A/c"}
    ]
  }
];

let state = {
  levelIdx:0, queue:[], qIdx:0, txn:null,
  score:0, highScore:0, streak:0, correctCount:0, totalCount:0,
  selection:{debit:null, credit:null}, answered:false, masterMode:false
};

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildQueue(idx){ return shuffle(LEVELS[idx].txns.map((t,i)=>({...t, levelIdx:idx, origIdx:i}))); }

const el = {
  scoreDigits: document.getElementById('score-digits'),
  highScoreValue: document.getElementById('highscore-value'),
  levelValue: document.getElementById('level-value'),
  levelStars: document.getElementById('level-stars'),
  streakValue: document.getElementById('streak-value'),
  streakFlame: document.getElementById('streak-flame'),
  accuracyValue: document.getElementById('accuracy-value'),
  missionTag: document.getElementById('mission-tag'),
  missionText: document.getElementById('mission-text'),
  missionAmount: document.getElementById('mission-amount'),
  debitGrid: document.getElementById('debit-grid'),
  creditGrid: document.getElementById('credit-grid'),
  debitChosen: document.getElementById('debit-chosen'),
  creditChosen: document.getElementById('credit-chosen'),
  submitBtn: document.getElementById('submit-btn'),
  nextBtn: document.getElementById('next-btn'),
  feedback: document.getElementById('feedback-banner'),
  logStrip: document.getElementById('log-strip'),
  screen: document.getElementById('screen'),
  toastLayer: document.getElementById('toast-layer')
};

function pad7(n){ return String(Math.max(0,Math.round(n))).padStart(7,'0'); }

function animateScoreTo(newScore){
  const start = parseInt(el.scoreDigits.textContent,10) || 0;
  const diff = newScore - start;
  if(diff===0){ el.scoreDigits.textContent = pad7(newScore); return; }
  const steps = 16; let i=0;
  const timer = setInterval(()=>{
    i++;
    const val = Math.round(start + diff*(i/steps));
    el.scoreDigits.textContent = pad7(val);
    if(i>=steps){ clearInterval(timer); el.scoreDigits.textContent = pad7(newScore); }
  }, 16);
}

function log(html, cls){
  const line = document.createElement('div');
  line.className = 'ln ' + (cls||'');
  line.innerHTML = html;
  el.logStrip.appendChild(line);
  el.logStrip.scrollTop = el.logStrip.scrollHeight;
}

function toast(msg, cls){
  const t = document.createElement('div');
  t.className = 'toast' + (cls?(' '+cls):'');
  t.textContent = msg;
  el.toastLayer.appendChild(t);
  setTimeout(()=>t.remove(), 3100);
}

function updateHUD(){
  animateScoreTo(state.score);
  if(state.score > state.highScore){
    state.highScore = state.score;
    el.highScoreValue.textContent = pad7(state.highScore);
    saveHighScore();
  }
  el.levelValue.textContent = state.masterMode ? "MASTER" : (state.levelIdx+1) + "·" + LEVELS[state.levelIdx].name.toUpperCase();
  el.levelStars.textContent = state.masterMode ? "★★★+" : LEVELS[state.levelIdx].stars;
  el.streakValue.textContent = state.streak;
  el.streakFlame.classList.toggle('lit', state.streak>0);
  el.accuracyValue.textContent = state.totalCount ? Math.round(100*state.correctCount/state.totalCount)+"%" : "—";
}

async function loadHighScore(){
  try{
    if(window.storage){
      const r = await window.storage.get('ledger-legends-highscore', false);
      if(r && r.value){ state.highScore = parseInt(r.value,10) || 0; }
    }
  }catch(e){ /* no saved score yet */ }
  el.highScoreValue.textContent = pad7(state.highScore);
}
async function saveHighScore(){
  try{ if(window.storage){ await window.storage.set('ledger-legends-highscore', String(state.highScore), false); } }catch(e){}
}

function accountPool(){
  if(state.masterMode) return Array.from(new Set(LEVELS.flatMap(l=>l.accounts))).sort();
  return LEVELS[state.levelIdx].accounts;
}

function renderGrid(gridEl, role){
  gridEl.innerHTML = '';
  accountPool().forEach(acc=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = '<span>'+(TAG_ICON[ACCOUNTS[acc]]||'•')+'</span><span>'+acc+'</span>';
    chip.addEventListener('click', ()=>{
      if(state.answered) return;
      state.selection[role] = acc;
      [...gridEl.children].forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      (role==='debit'?el.debitChosen:el.creditChosen).textContent = '→ ' + acc;
      checkReady();
    });
    gridEl.appendChild(chip);
  });
}

function checkReady(){
  el.submitBtn.disabled = state.answered || !(state.selection.debit && state.selection.credit);
}

function loadTransaction(){
  state.answered = false;
  state.selection = {debit:null, credit:null};
  el.debitChosen.textContent = '';
  el.creditChosen.textContent = '';
  el.feedback.textContent = '';
  el.feedback.className = 'feedback-banner';

  const t = state.masterMode
    ? shuffle(LEVELS.flatMap((lvl,li)=>lvl.txns.map(tt=>({...tt, levelIdx:li}))))[0]
    : state.queue[state.qIdx];
  state.txn = t;
  state.totalCount++;

  el.missionTag.textContent = 'TRANSACTION #' + state.totalCount + (state.masterMode ? ' · MASTER MODE' : ' · LVL ' + (state.levelIdx+1));
  el.missionText.textContent = '"' + t.d + '"';
  el.missionAmount.textContent = fmtINR(t.amt);

  renderGrid(el.debitGrid, 'debit');
  renderGrid(el.creditGrid, 'credit');

  el.submitBtn.style.display = 'inline-block';
  el.submitBtn.disabled = true;
  el.nextBtn.style.display = 'none';

  updateHUD();
}

function spawnFloatPop(text, cls){
  const p = document.createElement('div');
  p.className = 'float-pop ' + cls;
  p.textContent = text;
  el.screen.appendChild(p);
  setTimeout(()=>p.remove(), 1150);
}

function spawnSparks(emoji, count){
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = emoji;
    const x = 40 + Math.random()*20 + '%';
    const y = '45%';
    s.style.left = x; s.style.top = y;
    const dx = (Math.random()-0.5)*160;
    const dy = -80 - Math.random()*90;
    s.style.setProperty('--fly', 'translate('+dx+'px,'+dy+'px)');
    el.screen.appendChild(s);
    setTimeout(()=>s.remove(), 950);
  }
}

function levelUpToast(){
  const idx = state.levelIdx;
  log('&nbsp;','');
  log('✔ LEVEL ' + idx + ' CLEARED — ' + LEVELS[idx-1].name, 'pass');
  log('⤴ LEVEL ' + (idx+1) + ' UNLOCKED — ' + LEVELS[idx].name, 'lvl');
  toast('🏅 LEVEL ' + (idx+1) + ' UNLOCKED: ' + LEVELS[idx].name.toUpperCase(), 'level');
}

function nextQuestion(){
  if(state.masterMode){ loadTransaction(); return; }
  state.qIdx++;
  if(state.qIdx >= state.queue.length){
    if(state.levelIdx < LEVELS.length-1){
      state.levelIdx++;
      state.queue = buildQueue(state.levelIdx);
      state.qIdx = 0;
      levelUpToast();
    } else {
      state.masterMode = true;
      log('&nbsp;','');
      log('🏆 ALL LEVELS CLEARED! MASTER MODE ENGAGED — endless shuffled challenge.', 'lvl');
      toast('🏆 ALL LEVELS CLEARED! MASTER MODE ENGAGED', 'level');
    }
  }
  loadTransaction();
}
el.nextBtn.addEventListener('click', nextQuestion);

el.submitBtn.addEventListener('click', ()=>{
  if(state.answered || !(state.selection.debit && state.selection.credit)) return;
  state.answered = true;
  el.submitBtn.disabled = true;

  const t = state.txn;
  const debitOK = state.selection.debit === t.debit;
  const creditOK = state.selection.credit === t.credit;
  const bothOK = debitOK && creditOK;

  log('$ verifying transaction_' + String(state.totalCount).padStart(2,'0'), 'info');

  if(bothOK){
    state.correctCount++;
    state.streak++;
    let gained = 100;
    log('✓ DEBIT ' + t.debit + ' ' + fmtINR(t.amt) + ' — correct', 'pass');
    log('✓ CREDIT ' + t.credit + ' ' + fmtINR(t.amt) + ' — correct', 'pass');
    if(state.streak>0 && state.streak%5===0){
      gained += 200;
      log('🔥 COMBO x' + state.streak + '! BONUS +200', 'combo');
      toast('🔥 COMBO x' + state.streak + '!  +200 BONUS', 'level');
    }
    state.score += gained;
    el.feedback.textContent = '✅ CORRECT! ' + t.debit + ' Dr / ' + t.credit + ' Cr';
    el.feedback.className = 'feedback-banner correct';
    spawnFloatPop('+' + gained, 'good');
    spawnSparks('🪙', 8);
  } else {
    state.streak = 0;
    const lost = 50;
    if(!debitOK) log('✗ DEBIT expected "' + t.debit + '", chose "' + state.selection.debit + '"', 'fail');
    else log('✓ DEBIT ' + t.debit + ' — correct', 'pass');
    if(!creditOK) log('✗ CREDIT expected "' + t.credit + '", chose "' + state.selection.credit + '"', 'fail');
    else log('✓ CREDIT ' + t.credit + ' — correct', 'pass');
    log('⚠ STREAK RESET  −50 XP', 'fail');
    state.score = Math.max(0, state.score - lost);
    el.feedback.textContent = '❌ Correct entry: ' + t.debit + ' Dr ' + fmtINR(t.amt) + ' / ' + t.credit + ' Cr ' + fmtINR(t.amt);
    el.feedback.className = 'feedback-banner wrong';
    spawnFloatPop('-' + lost, 'bad');
    el.screen.classList.add('shake');
    setTimeout(()=>el.screen.classList.remove('shake'), 400);
  }

  el.submitBtn.style.display = 'none';
  el.nextBtn.style.display = 'inline-block';
  updateHUD();
});

// ---------- Init ----------
(async function init(){
  await loadHighScore();
  state.queue = buildQueue(0);
  loadTransaction();
  updateHUD();
})();

})();
</script>
</body>
</html>
